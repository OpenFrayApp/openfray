name: Promote production candidate

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: 'Coordinated root commit to promote'
        required: true
        type: string
      rollback_target:
        description: 'Tested coherent root commit for rollback'
        required: true
        type: string
      staging_attestation_run_id:
        description: 'Required for a release-critical candidate'
        required: false
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PRODUCTION_APPROVER: ${{ vars.PRODUCTION_APPROVER }}
      PRODUCTION_ENVIRONMENT_ID: ${{ vars.PRODUCTION_ENVIRONMENT_ID }}
      STAGING_ENVIRONMENT_ID: ${{ vars.STAGING_ENVIRONMENT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          submodules: recursive
      - run: git submodule foreach git fetch --no-tags origin main
      - run: npm ci
      - name: Download reviewed staging evidence
        if: inputs.staging_attestation_run_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: staging-release-attestation
          path: .artifacts/staging
          run-id: ${{ inputs.staging_attestation_run_id }}
          github-token: ${{ github.token }}
      - name: Gate the exact production candidate
        id: gate
        run: |
          arguments=(
            --output .artifacts/production
            --rollback-target "${{ inputs.rollback_target }}"
            --approver "$PRODUCTION_APPROVER"
            --production-environment "$PRODUCTION_ENVIRONMENT_ID"
            --staging-environment "$STAGING_ENVIRONMENT_ID"
          )
          if [[ -n "${{ inputs.staging_attestation_run_id }}" ]]; then
            arguments+=(--staging-attestation .artifacts/staging/staging-release-attestation.json)
          fi
          npm run verify:promotion -- "${arguments[@]}"
      - id: build
        run: npm run build
      - name: Deploy the approved candidate
        id: deploy
        run: |
          npx wrangler@4.37.1 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch production \
            --commit-hash "${{ inputs.candidate_commit }}"
      - name: Finalize the release record
        if: ${{ always() && steps.gate.outcome == 'success' }}
        env:
          DEPLOYMENT_RESULT: ${{ steps.deploy.outcome == 'success' && 'passed' || 'failed' }}
        run: |
          npm run record:deployment -- \
            --manifest .artifacts/production/release-manifest.json \
            --result "$DEPLOYMENT_RESULT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: production-release-manifest
          path: .artifacts/production/release-manifest.json
          if-no-files-found: error
