name: Stage release candidate

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: 'Coordinated root commit to stage'
        required: true
        type: string
      rollback_target:
        description: 'Tested coherent root commit for rollback'
        required: true
        type: string
      migration:
        description: 'Migration staging result'
        required: true
        type: choice
        options: [not-applicable, passed]
      authentication:
        description: 'Authentication staging result'
        required: true
        type: choice
        options: [not-applicable, passed]
      row_level_security:
        description: 'Row-Level Security staging result'
        required: true
        type: choice
        options: [not-applicable, passed]
      sharing:
        description: 'Sharing staging result'
        required: true
        type: choice
        options: [not-applicable, passed]
      backup:
        description: 'Backup health result'
        required: true
        type: choice
        options: [not-applicable, passed]
      rollback_exercise:
        description: 'Rollback exercise result'
        required: true
        type: choice
        options: [passed]

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          submodules: recursive
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: Deploy the staging candidate
        run: |
          npx wrangler@4.37.1 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch staging \
            --commit-hash "${{ inputs.candidate_commit }}"

  attest:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-attestation
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_ENVIRONMENT_ID: ${{ vars.STAGING_ENVIRONMENT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          submodules: recursive
      - run: git submodule foreach git fetch --no-tags origin main
      - name: Record the environment reviewer
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            | node scripts/environment-approval.mjs staging-attestation \
            >> "$GITHUB_ENV"
      - name: Record reviewed staging results
        run: |
          npm run attest:staging -- \
            --output .artifacts/staging/staging-release-attestation.json \
            --rollback-target "${{ inputs.rollback_target }}" \
            --environment "$STAGING_ENVIRONMENT_ID" \
            --approver "$PROMOTION_APPROVER" \
            --migration "${{ inputs.migration }}" \
            --authentication "${{ inputs.authentication }}" \
            --row-level-security "${{ inputs.row_level_security }}" \
            --sharing "${{ inputs.sharing }}" \
            --backup "${{ inputs.backup }}" \
            --rollback-exercise "${{ inputs.rollback_exercise }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-release-attestation
          path: .artifacts/staging/staging-release-attestation.json
          if-no-files-found: error
